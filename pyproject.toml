[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobx"
version = "0.1.0"
description = "Messy Indian job postings to strict JSON: synthetic data, QLoRA fine-tuning, evaluation and CPU serving."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srinivasan Balasubramanian" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.30"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llama = ["llama-cpp-python>=0.3.2"]
space = ["gradio==5.49.1", "huggingface_hub>=0.30"]
nli = ["transformers>=4.45", "torch"]
# GPU stack: the notebooks pin exact versions for Colab T4; these are lower bounds.
train = [
  "transformers>=4.56,<5",
  "trl>=0.23,<0.24",
  "peft>=0.17,<0.18",
  "bitsandbytes>=0.48",
  "accelerate>=1.10",
  "datasets>=4.0",
  "wandb>=0.21",
  "huggingface_hub>=0.30",
]
guided = ["lm-format-enforcer>=0.11"]
api = ["openai>=1.40", "anthropic>=2.4,<3"]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8",
  "nbformat>=5.10",
  "jsonschema>=4.21",
  "types-PyYAML",
  "fastapi>=0.110",
  "httpx>=0.27",
  "anthropic>=2.4,<3",
  "openai>=1.40",
]

[project.scripts]
jobx = "jobx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobx"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["jobx", "conftest"]

[tool.mypy]
python_version = "3.12"
files = ["src/jobx", "space/app.py"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "torch", "torch.*", "transformers", "transformers.*", "trl", "trl.*", "peft", "peft.*",
  "datasets", "datasets.*", "wandb", "wandb.*", "huggingface_hub", "huggingface_hub.*",
  "llama_cpp", "llama_cpp.*", "gradio", "gradio.*", "lmformatenforcer", "lmformatenforcer.*",
  "awq", "awq.*", "bitsandbytes", "tqdm", "tqdm.*", "matplotlib", "matplotlib.*", "google.colab", "google.colab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
