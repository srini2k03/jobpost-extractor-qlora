name: real-probe
# Probe public sources of REAL job postings (licence first) and, for the ODC-By web corpus, sample a pool
# of Indian job-board pages for annotation. Reports go to results/real/, the pool to data/real/pool_web.jsonl.
on:
  workflow_dispatch:
    inputs:
      web_max_files:
        description: "FineWeb parquet files whose url column is scanned"
        default: "14"

permissions:
  contents: write

concurrency:
  group: real-probe
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  datasets:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements/real-data.txt -e .
      - run: python -m jobx.data.real_probe datasets --out results/real/probe_datasets.json
      - name: Commit the report
        run: |
          scripts/commit_results.sh "Real-data probe - Hub datasets (licence, gating, row stats)" results/real/probe_datasets.json

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements/real-data.txt -e .
      - run: |
          python -m jobx.data.real_probe web-pool --out results/real/probe_web.json \
            --max-files "${{ inputs.web_max_files }}" --pool-out data/real/pool_web.jsonl
          python - <<'PY'
          import json; r = json.load(open("results/real/probe_web.json"))
          print(json.dumps({k: v for k, v in r.items() if k != "files_scanned"}, indent=2))
          PY
      - name: Commit the report and the pool
        run: |
          scripts/commit_results.sh "Real-data probe - FineWeb job-board pages (url scan + pool)" results/real/probe_web.json data/real/pool_web.jsonl
