name: api-baseline
# Hosted-API upper bound: the project prompt + JSON schema on an API model. Default: the free Gemini API tier
# through its OpenAI-compatible endpoint (secret GEMINI_API_KEY). Also works with groq / openrouter
# (secrets GROQ_API_KEY / OPENROUTER_API_KEY) and, optionally, the Anthropic API (secret ANTHROPIC_API_KEY,
# with a cost estimate and a hard USD budget).
# Runs on test_synth, and on test_real when it exists. Free-tier friendly: client-side rate limit, backoff
# on 429, an on-disk response cache (kept between runs with actions/cache) and resumable runs. When the
# daily quota runs out, progress is committed and the next dispatch continues where it stopped.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "gemini | groq | openrouter | anthropic"
        required: true
        default: "gemini"
      model:
        description: "model id (Gemini free tier: gemini-3.8-flash; change it for other providers, blank = preset)"
        required: false
        default: "gemini-3.8-flash"
      model_fallbacks:
        description: "comma list used after 2 consecutive 503s (or a 403/404) on the model; blank for none"
        required: false
        default: "gemini-3.7-flash,gemini-3.5-flash"
      splits:
        description: "comma list; splits missing from the repo are skipped"
        required: true
        default: "test_synth,test_real"
      shots:
        description: "comma list of shot counts (3 = the shared 3-shot exemplars, 0 = zero-shot)"
        required: true
        default: "3"
      max_examples:
        description: "max examples per split and shot setting (evenly spaced subset)"
        required: true
        default: "200"
      rpm:
        description: "client-side requests per minute (free tiers: ~10)"
        required: true
        default: "10"
      approach_prefix:
        description: "results row id prefix (gemini-flash -> 'Gemini Flash (API, few-shot)')"
        required: true
        default: "gemini-flash"
      budget_usd:
        description: "anthropic only: hard USD cap"
        required: true
        default: "2.0"

permissions:
  contents: write

concurrency:
  group: api-baseline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROVIDER: ${{ inputs.provider }}
    steps:
      - name: Check the API key secret
        run: |
          case "$PROVIDER" in
            gemini) KEY_NAME=GEMINI_API_KEY ;;
            groq) KEY_NAME=GROQ_API_KEY ;;
            openrouter) KEY_NAME=OPENROUTER_API_KEY ;;
            anthropic) KEY_NAME=ANTHROPIC_API_KEY ;;
            *) echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac
          if [ -z "${!KEY_NAME}" ]; then
            echo "::error::Repository secret $KEY_NAME is empty or missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[api]"
      - name: Restore API response cache
        uses: actions/cache@v4
        with:
          path: .cache/jobx-api
          key: api-cache-v2-${{ inputs.provider }}-${{ github.run_id }}
          restore-keys: api-cache-v2-${{ inputs.provider }}-
      - name: Run (resumable)
        id: run
        run: |
          set +e
          if [ "$PROVIDER" = "anthropic" ]; then
            ARGS=(--splits "${{ inputs.splits }}" --shots "${{ inputs.shots }}"
                  --max-examples "${{ inputs.max_examples }}" --budget-usd "${{ inputs.budget_usd }}")
            if [ -n "${{ inputs.model }}" ]; then ARGS+=(--model "${{ inputs.model }}"); fi
            python -m jobx.baselines.anthropic_runner "${ARGS[@]}"
          else
            ARGS=(--provider "$PROVIDER" --splits "${{ inputs.splits }}" --shots "${{ inputs.shots }}"
                  --max-examples "${{ inputs.max_examples }}" --rpm "${{ inputs.rpm }}"
                  --approach-prefix "${{ inputs.approach_prefix }}"
                  --model-fallbacks "${{ inputs.model_fallbacks }}")
            if [ -n "${{ inputs.model }}" ]; then ARGS+=(--model "${{ inputs.model }}"); fi
            python -m jobx.baselines.openai_compat_runner "${ARGS[@]}"
          fi
          CODE=$?
          # 0 ok | 4 quota exhausted after some completions | 5 fatal config (401/403/404) | 6 nothing completed
          case $CODE in
            0) echo "succeeded=true" >> "$GITHUB_OUTPUT" ;;
            4) echo "succeeded=true" >> "$GITHUB_OUTPUT"
               echo "::warning::Free-tier quota exhausted; partial progress will be committed. Re-run later to resume." ;;
            5) echo "::error::Fatal API configuration error (bad key, or no usable model in the chain; see log). Nothing committed."; exit 1 ;;
            6) echo "::error::No request completed; nothing to score or commit."; exit 1 ;;
            *) exit $CODE ;;
          esac
      - name: Metrics + results table
        if: steps.run.outputs.succeeded == 'true'
        run: |
          jobx eval
          jobx results-table
      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.succeeded == 'true'
        with:
          name: api-baseline
          path: |
            results/predictions/*.meta.json
            results/metrics/*.json
      - name: Commit results
        if: steps.run.outputs.succeeded == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "API baseline: ${{ inputs.provider }} ${{ inputs.model }} (shots ${{ inputs.shots }})"
          git push
