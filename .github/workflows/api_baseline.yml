name: api-baseline
# Hosted-API upper bound: the project prompt + JSON schema sent to an Anthropic model (structured outputs),
# zero-shot and few-shot, on test_synth and on test_real when it exists. The runner prints a cost estimate
# (count_tokens) before any request, shrinks the evenly spaced subset to fit the budget, and stops starting
# requests if actual spend would pass it. Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Anthropic model id"
        required: true
        default: "claude-opus-5-5"
      splits:
        description: "comma list; splits missing from the repo are skipped"
        required: true
        default: "test_synth,test_real"
      shots:
        description: "comma list of shot counts (0 = zero-shot, 3 = the shared 3-shot exemplars)"
        required: true
        default: "0,3"
      max_examples:
        description: "max examples per split and shot setting (reduced automatically to fit the budget)"
        required: true
        default: "100"
      effort:
        description: "output_config.effort"
        required: true
        default: "low"
      budget_usd:
        description: "hard cap for this run, USD"
        required: true
        default: "2.0"
      estimate_only:
        description: "only print the cost estimate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: api-baseline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check the API key secret
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is empty or missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[api]"
      - name: Estimate cost, then run
        run: |
          ARGS=(--model "${{ inputs.model }}" --splits "${{ inputs.splits }}" --shots "${{ inputs.shots }}"
                --max-examples "${{ inputs.max_examples }}" --effort "${{ inputs.effort }}"
                --budget-usd "${{ inputs.budget_usd }}")
          if [ "${{ inputs.estimate_only }}" = "true" ]; then ARGS+=(--estimate-only); fi
          python -m jobx.baselines.anthropic_runner "${ARGS[@]}"
      - name: Metrics + results table
        if: ${{ !inputs.estimate_only }}
        run: |
          jobx eval
          jobx results-table
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.estimate_only }}
        with:
          name: api-baseline
          path: |
            results/predictions/${{ inputs.model }}_*
            results/metrics/${{ inputs.model }}_*
      - name: Commit results
        if: ${{ !inputs.estimate_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "API baseline: ${{ inputs.model }} (shots ${{ inputs.shots }})"
          git push
