name: lora-study
# Compute-aware LoRA study (configs/lora_study.yaml): each configuration trains on the same reduced budget on
# its own CPU runner, is merged, converted to GGUF Q8_0 and scored on validation postings with llama.cpp.
# The collect job writes results/lora_study/summary.json (validation-only selection) and commits.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lora-study
  cancel-in-progress: false

env:
  LLAMA_CPP_REF: b6000
  HF_HUB_DISABLE_TELEMETRY: "1"
  MALLOC_ARENA_MAX: "2"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - id: m
        run: echo "matrix=$(python -m jobx.cpu.study matrix)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ env.LLAMA_CPP_REF }}-avx2-u2404-v1
      - run: scripts/build_llama_cpp.sh "$LLAMA_CPP_REF" llama.cpp
      - run: pip install -r requirements/cpu-train.txt -e ".[serve]"
      - name: Train ${{ matrix.id }}
        run: python -m jobx.cpu.study train --config-id "${{ matrix.id }}"
      - name: Merge, GGUF Q8_0, validation predictions
        run: |
          W=outputs/study/${{ matrix.id }}
          python -m jobx.train.merge --base Qwen/Qwen2.5-0.5B-Instruct --adapter "$W/adapter" --out "$W/merged"
          scripts/gguf_convert.sh llama.cpp "$W/merged" "$W/gguf" study Q8_0
          python -m jobx.quantize.benchmark --server-bin llama.cpp/build/bin/llama-server --model "$W/gguf/study-Q8_0.gguf" \
            --approach "study-${{ matrix.id }}" --split val --max-examples "$(python -c "import yaml; print(yaml.safe_load(open('configs/lora_study.yaml'))['shared']['val_eval_n'])")" \
            --system compact --threads "$(nproc)" --out-pred "$W/pred"
          python -m jobx.cpu.study score --config-id "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: study-${{ matrix.id }}
          path: |
            results/lora_study/${{ matrix.id }}.json
            results/lora_study/predictions/${{ matrix.id }}__val.jsonl

  collect:
    needs: run
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e . matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: study-*
          merge-multiple: true
          path: results/lora_study
      - name: Summary and commit
        run: |
          python -m jobx.cpu.study summary
          scripts/commit_results.sh "LoRA study - reduced-budget sweep (CPU, GitHub Actions)" results/lora_study
