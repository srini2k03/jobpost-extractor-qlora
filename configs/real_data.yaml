# Real public job postings for the headline test set (fetched in Colab or CI; HF Hub is not
# reachable from the build sandbox, so none of this has been run yet).
#
# Candidates are tried in order. For each, the licence declared on the dataset card is read at
# runtime and must be in `licence_allowlist`; otherwise the candidate is skipped.
# TODO(licence): a human must still open the dataset card and confirm the licence and the terms of
# the underlying source before committing any real text. See docs/real_dataset.md.
candidates:
  - id: datastax/linkedin_job_listings
    split: train
    text_columns: [description]
    location_columns: [location]
    company_column: company_name
    title_column: title
  - id: jacob-hugging-face/job-descriptions
    split: train
    text_columns: [job_description]
    location_columns: []
    company_column: company_name
    title_column: position_title
  # extra ids probed by `python -m jobx.data.real_probe datasets` (licence read from the card first)
  - id: cnamuangtoun/resume-job-description-fit
  - id: lukebarousse/data_jobs
  - id: xanderios/linkedin-job-postings
  - id: nathansutton/data-science-job-descriptions
  - id: jjzha/skillspan
  - id: TechWolf/Synthetic-ESCO-skill-sentences
licence_allowlist: [mit, apache-2.0, cc0-1.0, cc-by-4.0, cc-by-sa-4.0, odc-by, pddl, cdla-permissive-2.0, odbl]
n_target: 200
min_chars: 200
max_chars: 3000
max_rows_scanned: 200000
seed: 11

# Shortlist for `python -m jobx.data.real_probe details` (allowlisted licences in probe_datasets.json):
# card text (provenance) and India-row counts. The final choice and its reasons go to data/real/real_meta.json.
shortlist:
  - logiover/naukri-job-scraper-sample-data
  - tor24/india-startup-jobs-mini-001
  - NextGig-Rocks/global-job-postings-multi-ats
  - JobOpportunitiesAPI/joa-employer-direct-job-postings-2026-10
  - makenomistakesllc/tech-job-postings-9-ats
  - MariaScales/ai-job-postings-12-countries
  - victor/real-or-fake-fake-jobposting-prediction
  - xanderios/linkedin-job-postings
  - lang-uk/recruitment-dataset-job-descriptions-english

# Web corpus probe (`python -m jobx.data.real_probe web|web-pool`): pages on Indian job boards in an ODC-By
# crawl. Only the url column is scanned; the text of matching rows is read for the pool.
web_corpus:
  repo: HuggingFaceFW/fineweb
  pattern: sample/10BT/*.parquet
  max_files: 14
  n_pool: 400            # candidates committed for annotation (non-ads are rejected during annotation)
  max_per_domain: 120
  min_chars: 300
  max_chars: 3500
